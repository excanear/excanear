  <g class="mono">
    <g opacity="0" transform="translate(0,6)"><animate attributeName="opacity" from="0" to="1" begin="1.45s" dur="0.35s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="1.45s" dur="0.35s" fill="freeze"/>
      <text x="28" y="116" fill="#e9edf2">OWASP-Bypass</text><text x="300" y="116" fill="#e8a33d">106/107 Juice Shop</text><text x="700" y="116" fill="#6b7682">python</text></g>
    <g opacity="0" transform="translate(0,6)"><animate attributeName="opacity" from="0" to="1" begin="1.60s" dur="0.35s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="1.60s" dur="0.35s" fill="freeze"/>
      <text x="28" y="142" fill="#e9edf2">Web-Recon-Platform</text><text x="300" y="142" fill="#c9d1d9">fingerprint + NVD CVE</text><text x="700" y="142" fill="#6b7682">python</text></g>
    <g opacity="0" transform="translate(0,6)"><animate attributeName="opacity" from="0" to="1" begin="1.75s" dur="0.35s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="1.75s" dur="0.35s" fill="freeze"/>
      <text x="28" y="168" fill="#e9edf2">devkit</text><text x="300" y="168" fill="#e8a33d">100% Assembly x86-64</text><text x="700" y="168" fill="#6b7682">asm</text></g>
    <g opacity="0" transform="translate(0,6)"><animate attributeName="opacity" from="0" to="1" begin="1.90s" dur="0.35s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="1.90s" dur="0.35s" fill="freeze"/>
      <text x="28" y="194" fill="#e9edf2">OSIRIS</text><text x="300" y="194" fill="#c9d1d9">system intelligence</text><text x="700" y="194" fill="#6b7682">rust</text></g>
    <g opacity="0" transform="translate(0,6)"><animate attributeName="opacity" from="0" to="1" begin="2.05s" dur="0.35s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="2.05s" dur="0.35s" fill="freeze"/>
      <text x="28" y="220" fill="#e9edf2">Network-Kernel-Driver</text><text x="300" y="220" fill="#c9d1d9">kernel-level netfilter</text><text x="700" y="220" fill="#6b7682">rust</text></g>
    <g opacity="0" transform="translate(0,6)"><animate attributeName="opacity" from="0" to="1" begin="2.20s" dur="0.35s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="2.20s" dur="0.35s" fill="freeze"/>
      <text x="28" y="246" fill="#e9edf2">Sysinfo-Shell</text><text x="300" y="246" fill="#c9d1d9">POSIX · zero deps</text><text x="700" y="246" fill="#6b7682">shell</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.4s" fill="freeze"/>
      <text x="28" y="278" fill="#4cc2d4">$</text>
      <rect x="46" y="266" width="9" height="18" fill="#4cc2d4"><animate attributeName="opacity" values="1;0" dur="0.6s" begin="2.5s" repeatCount="indefinite"/></rect></g>
  </g>
