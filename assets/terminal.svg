<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ls ~/arsenal — projetos selecionados">
  <defs>
    <style>.mono{font-family:'JetBrains Mono','SF Mono','Consolas',ui-monospace,monospace;font-size:14px;}</style>
    <clipPath id="type"><rect x="28" y="60" width="0" height="26"><animate attributeName="width" from="0" to="320" begin="0.3s" dur="0.9s" calcMode="discrete" keyTimes="0;0.18;0.36;0.54;0.72;0.9;1" values="0;60;120;180;240;300;320" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="2" y="2" width="896" height="296" rx="10" fill="#0b0d10" stroke="#1f242b" stroke-width="1.5"/>
  <!-- title bar -->
  <line x1="2" y1="40" x2="898" y2="40" stroke="#1f242b" stroke-width="1"/>
  <circle cx="28" cy="21" r="5" fill="#2a313a"/><circle cx="48" cy="21" r="5" fill="#2a313a"/><circle cx="68" cy="21" r="5" fill="#e8a33d" opacity="0.6"/>
  <text x="450" y="26" text-anchor="middle" class="mono" font-size="11" fill="#6b7682" letter-spacing="1.5">~/arsenal — operator shell</text>

  <!-- prompt (typed) -->
  <text x="28" y="79" class="mono" fill="#4cc2d4">$</text>
  <g clip-path="url(#type)"><text x="46" y="79" class="mono" fill="#c9d1d9">ls ~/arsenal --sort=impact</text></g>
  <rect x="366" y="66" width="9" height="18" fill="#4cc2d4">
