<svg width="900" height="104" viewBox="0 0 900 104" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Colofão — uso autorizado, escanearcplx.com">
  <defs>
    <style>.mono{font-family:'JetBrains Mono','SF Mono','Consolas',ui-monospace,monospace;}</style>
    <filter id="gc" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="dec"><rect x="28" y="22" width="0" height="26"><animate attributeName="width" from="0" to="640" begin="0.3s" dur="1.4s" calcMode="spline" keySplines="0.4 0 0.2 1" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="2" y="2" width="896" height="100" rx="8" fill="#0b0d10" stroke="#1f242b" stroke-width="1.5"/>
  <rect x="2" y="2" width="4" height="100" rx="2" fill="#e8a33d"/>

  <!-- decrypting ethics line -->
  <g clip-path="url(#dec)">
    <text x="28" y="42" class="mono" font-size="14" fill="#c9d1d9">O conhecimento ofensivo existe para fortalecer a defesa, não para violá-la.</text>
  </g>
  <!-- cyan decrypt head -->
  <rect x="0" y="22" width="3" height="26" fill="#4cc2d4" filter="url(#gc)">
    <animate attributeName="x" from="28" to="668" begin="0.3s" dur="1.4s" calcMode="spline" keySplines="0.4 0 0.2 1" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="1.6s" dur="0.3s" fill="freeze"/>
  </rect>

  <text x="28" y="72" class="mono" font-size="11" fill="#6b7682" letter-spacing="2" opacity="0">USO AUTORIZADO · PESQUISA E SEGURANÇA DEFENSIVA
    <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.5s" fill="freeze"/></text>

  <!-- integrity / channel -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.5s" fill="freeze"/>
    <text x="872" y="44" text-anchor="end" class="mono" font-size="11" fill="#6b7682" letter-spacing="1.5">INTEGRIDADE ✓</text>
    <text x="872" y="72" text-anchor="end" class="mono" font-size="14" fill="#e8a33d">escanearcplx.com</text>
  </g>
</svg>
