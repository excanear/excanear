<svg width="900" height="24" viewBox="0 0 900 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="presentation">
  <defs>
    <filter id="gp" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="pls" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4cc2d4" stop-opacity="0"/><stop offset="55%" stop-color="#4cc2d4" stop-opacity="0"/><stop offset="80%" stop-color="#e8a33d" stop-opacity="1"/><stop offset="100%" stop-color="#4cc2d4" stop-opacity="0"/></linearGradient>
  </defs>
  <line x1="0" y1="12" x2="846" y2="12" stroke="#1f242b" stroke-width="1"/>
  <path d="M858 6 l0 12 M864 6 l0 12 M870 6 l0 12" stroke="#2a313a" stroke-width="1.5"/>
  <!-- traveling pulse -->
  <rect x="0" y="11" width="160" height="2" fill="url(#pls)" filter="url(#gp)">
    <animate attributeName="x" from="-160" to="846" dur="3.2s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1"/>
  </rect>
</svg>
