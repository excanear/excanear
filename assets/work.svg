<svg width="900" height="562" viewBox="0 0 900 562" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Selected Work: OWASP Bypass, Web Recon Platform, DEVKIT, OSIRIS, Network Kernel Driver, Sysinfo Shell">
  <defs><style>
    .d{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:800;}
    .nm{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:700;}
    .n{font-family:'Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:900;}
    .m{font-family:'JetBrains Mono','SF Mono',Consolas,ui-monospace,monospace;}
  </style></defs>
  <rect width="900" height="562" fill="#0b0b0c"/>

  <text x="0" y="22" class="m" font-size="12.5" fill="#9a9a9a" letter-spacing="3">§ 01 / 03</text>
  <text x="0" y="54" class="d" font-size="36" fill="#f6f6f4" letter-spacing="-0.5">SELECTED WORK</text>
  <rect x="312" y="42" width="52" height="5" fill="#ff512e"><animate attributeName="width" from="0" to="52" begin="0.2s" dur="0.5s" fill="freeze"/></rect>
  <line x1="372" y1="44.5" x2="900" y2="44.5" stroke="#333335"/>

  <g class="nm" font-size="23">
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.35s" dur="0.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.35s" dur="0.5s" calcMode="spline" keySplines="0.2 1 0.3 1" fill="freeze"/>
      <line x1="0" y1="92" x2="900" y2="92" stroke="#262627"/>
      <text x="0" y="130" class="n" font-size="26" fill="#ff512e">01</text><text x="54" y="130" fill="#f6f6f4">OWASP Bypass</text><text x="900" y="130" text-anchor="end" class="m" font-size="13" fill="#9a9a9a">python</text>
      <text x="54" y="155" class="m" font-size="14" fill="#c4c4c2">Engine autônomo de exploração web · <tspan fill="#ff7a52" font-weight="700">106/107 do OWASP Juice Shop</tspan> resolvidos.</text></g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.47s" dur="0.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.47s" dur="0.5s" calcMode="spline" keySplines="0.2 1 0.3 1" fill="freeze"/>
      <line x1="0" y1="172" x2="900" y2="172" stroke="#262627"/>
      <text x="0" y="210" class="n" font-size="26" fill="#ff512e">02</text><text x="54" y="210" fill="#f6f6f4">Web Recon Platform</text><text x="900" y="210" text-anchor="end" class="m" font-size="13" fill="#9a9a9a">python</text>
      <text x="54" y="235" class="m" font-size="14" fill="#c4c4c2">Fingerprint real de tecnologia · <tspan fill="#ff7a52" font-weight="700">correlação de CVE via NVD</tspan>.</text></g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.59s" dur="0.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.59s" dur="0.5s" calcMode="spline" keySplines="0.2 1 0.3 1" fill="freeze"/>
      <line x1="0" y1="252" x2="900" y2="252" stroke="#262627"/>
      <text x="0" y="290" class="n" font-size="26" fill="#ff512e">03</text><text x="54" y="290" fill="#f6f6f4">DEVKIT</text><text x="900" y="290" text-anchor="end" class="m" font-size="13" fill="#9a9a9a">assembly</text>
      <text x="54" y="315" class="m" font-size="14" fill="#c4c4c2">Toolkit de terminal em <tspan fill="#ff7a52" font-weight="700">100% Assembly x86-64</tspan> · estático, zero dependências.</text></g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.71s" dur="0.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.71s" dur="0.5s" calcMode="spline" keySplines="0.2 1 0.3 1" fill="freeze"/>
      <line x1="0" y1="332" x2="900" y2="332" stroke="#262627"/>
      <text x="0" y="370" class="n" font-size="26" fill="#ff512e">04</text><text x="54" y="370" fill="#f6f6f4">OSIRIS</text><text x="900" y="370" text-anchor="end" class="m" font-size="13" fill="#9a9a9a">rust</text>
      <text x="54" y="395" class="m" font-size="14" fill="#c4c4c2">Inteligência e <tspan fill="#ff7a52" font-weight="700">resposta operacional</tspan> de sistema.</text></g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.83s" dur="0.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.83s" dur="0.5s" calcMode="spline" keySplines="0.2 1 0.3 1" fill="freeze"/>
      <line x1="0" y1="412" x2="900" y2="412" stroke="#262627"/>
      <text x="0" y="450" class="n" font-size="26" fill="#ff512e">05</text><text x="54" y="450" fill="#f6f6f4">Network Kernel Driver</text><text x="900" y="450" text-anchor="end" class="m" font-size="13" fill="#9a9a9a">rust</text>
      <text x="54" y="475" class="m" font-size="14" fill="#c4c4c2">Interceptação de rede em <tspan fill="#ff7a52" font-weight="700">nível de kernel</tspan>.</text></g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.95s" dur="0.5s" calcMode="spline" keySplines="0.2 1 0.3 1" fill="freeze"/>
      <line x1="0" y1="492" x2="900" y2="492" stroke="#262627"/>
      <text x="0" y="530" class="n" font-size="26" fill="#ff512e">06</text><text x="54" y="530" fill="#f6f6f4">Sysinfo Shell</text><text x="900" y="530" text-anchor="end" class="m" font-size="13" fill="#9a9a9a">shell</text>
      <text x="54" y="555" class="m" font-size="14" fill="#c4c4c2">System info em shell POSIX puro · <tspan fill="#ff7a52" font-weight="700">zero dependências</tspan> · multiplataforma.</text>
      <line x1="0" y1="561" x2="900" y2="561" stroke="#262627"/></g>
