<svg width="900" height="264" viewBox="0 0 900 264" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="excanear — Segurança ofensiva e engenharia de baixo nível">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', ui-monospace, monospace; }
      .wm   { font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', ui-monospace, monospace; font-weight: 700; }
    </style>
  </defs>

  <!-- plate -->
  <rect x="1" y="1" width="898" height="262" rx="10" fill="#0b0d10" stroke="#1f242b" stroke-width="1.5"/>

