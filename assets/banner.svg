  <!-- tagline -->
  <text x="58" y="214" class="mono" font-size="17" fill="#e8a33d" letter-spacing="1">Cinco frentes.</text>
  <text x="188" y="214" class="mono" font-size="17" fill="#c9d1d9" letter-spacing="1">Um perímetro.</text>

  <!-- title block (right) -->
  <g class="mono" font-size="11" letter-spacing="1.5">
    <line x1="648" y1="56" x2="648" y2="208" stroke="#1f242b" stroke-width="1.5"/>
    <line x1="648" y1="106" x2="844" y2="106" stroke="#1f242b" stroke-width="1"/>
    <line x1="648" y1="156" x2="844" y2="156" stroke="#1f242b" stroke-width="1"/>
    <line x1="746" y1="56"  x2="746" y2="208" stroke="#1f242b" stroke-width="1"/>

    <text x="662" y="78"  fill="#6b7682">FRENTES</text>
    <text x="760" y="78"  fill="#6b7682">PERÍMETRO</text>
    <text x="662" y="96"  class="wm" font-size="22" fill="#e9edf2">05</text>
    <text x="760" y="96"  class="wm" font-size="22" fill="#e9edf2">01</text>

