    <text x="760" y="128" fill="#6b7682">DESDE</text>
    <text x="760" y="146" class="wm" font-size="15" fill="#c9d1d9">2022</text>

    <text x="662" y="180" fill="#6b7682">REF</text>
    <text x="662" y="197" fill="#c9d1d9">0x45584341</text>
    <text x="760" y="180" fill="#6b7682">REV</text>
