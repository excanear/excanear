<svg width="900" height="338" viewBox="0 0 900 338" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="excanear — Security Researcher e Low-Level Engineer · 2022—present">
  <defs><style>
    .d{font-family:'Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:900;}
    .s{font-family:'Helvetica Neue',Arial,sans-serif;}
    .m{font-family:'JetBrains Mono','SF Mono',Consolas,ui-monospace,monospace;}
  </style></defs>
  <rect width="900" height="338" fill="#0b0b0c"/>

  <text x="0" y="34" class="m" font-size="12.5" fill="#9a9a9a" letter-spacing="3">VOL. 01 — OFFENSIVE SECURITY</text>
  <text x="900" y="34" text-anchor="end" class="m" font-size="12.5" fill="#9a9a9a" letter-spacing="3">2022 — PRESENT</text>
  <line x1="0" y1="48" x2="900" y2="48" stroke="#333335" stroke-width="1"/>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="0.1s" dur="0.85s" calcMode="spline" keySplines="0.2 1 0.3 1" fill="freeze"/>
    <text x="-6" y="190" class="d" font-size="126" fill="#f6f6f4" letter-spacing="-3">EXCANEAR</text>
  </g>

  <rect x="0" y="212" width="0" height="7" fill="#ff512e">
    <animate attributeName="width" from="0" to="578" begin="0.5s" dur="0.9s" calcMode="spline" keySplines="0.22 1 0.36 1" fill="freeze"/>
  </rect>
  <line x1="582" y1="215.5" x2="900" y2="215.5" stroke="#333335" stroke-width="1"/>

  <text x="0" y="256" class="m" font-size="15" fill="#d6d6d4" letter-spacing="2">SECURITY RESEARCHER  /  LOW-LEVEL ENGINEER</text>
  <text x="0" y="298" class="s" font-size="21" font-style="italic" fill="#b4b4b2">Eu construo a ferramenta — não só a prova de conceito.</text>
</svg>
