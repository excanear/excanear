<svg width="900" height="332" viewBox="0 0 900 332" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="excanear — Security Researcher e Low-Level Engineer">
  <defs>
    <style>
      .d{font-family:'Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:900;}
      .s{font-family:'Helvetica Neue',Arial,sans-serif;}
      .m{font-family:'JetBrains Mono','SF Mono',Consolas,ui-monospace,monospace;}
    </style>
  </defs>
  <rect width="900" height="332" fill="#0b0b0c"/>

  <!-- masthead meta -->
  <text x="0" y="34" class="m" font-size="12" fill="#8a8a8a" letter-spacing="3">VOL. 01 — OFFENSIVE SECURITY</text>
  <text x="900" y="34" text-anchor="end" class="m" font-size="12" fill="#8a8a8a" letter-spacing="3">2022 — PRESENT</text>
  <line x1="0" y1="48" x2="900" y2="48" stroke="#262627" stroke-width="1"/>

  <!-- giant wordmark -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.1s" dur="0.8s" calcMode="spline" keySplines="0.2 1 0.3 1" fill="freeze"/>
    <text x="-6" y="188" class="d" font-size="124" fill="#f2f2f0" letter-spacing="-3">EXCANEAR</text>
  </g>

  <!-- accent rule (wipes in) -->
  <rect x="0" y="210" width="0" height="6" fill="#e5502a">
    <animate attributeName="width" from="0" to="560" begin="0.5s" dur="0.9s" calcMode="spline" keySplines="0.22 1 0.36 1" fill="freeze"/>
  </rect>
  <line x1="564" y1="213" x2="900" y2="213" stroke="#262627" stroke-width="1"/>

  <!-- positioning + impact -->
  <text x="0" y="252" class="m" font-size="13.5" fill="#b9b9b7" letter-spacing="2">SECURITY RESEARCHER  /  LOW-LEVEL ENGINEER</text>
  <text x="0" y="292" class="s" font-size="19" font-style="italic" fill="#8a8a8a">Eu construo a ferramenta — não só a prova de conceito.</text>
</svg>
