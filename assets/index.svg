<svg width="900" height="322" viewBox="0 0 900 322" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Áreas de atuação: 01 Offensive/Red Team, 02 Application Security, 03 Reverse Engineering, 04 Forensics/DFIR, 05 Low-Level/Kernel">
